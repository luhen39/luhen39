<svg width="380" height="260" viewBox="0 0 380 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5DC9E2"/>
      <stop offset="100%" stop-color="#00ADD8"/>
    </radialGradient>
  </defs>

  <!-- Edges: linhas com dash animado a "fluir" dados -->
  <g stroke="#00ADD8" stroke-width="1.4" fill="none" opacity="0.55">
    <path id="e1" d="M60 60 L190 40" />
    <path id="e2" d="M190 40 L320 70" />
    <path id="e3" d="M60 60 L100 150" />
    <path id="e4" d="M190 40 L190 130" />
    <path id="e5" d="M190 130 L320 70" />
    <path id="e6" d="M100 150 L190 130" />
    <path id="e7" d="M190 130 L230 210" />
    <path id="e8" d="M100 150 L230 210" />
    <path id="e9" d="M320 70 L320 180" />
    <path id="e10" d="M230 210 L320 180" />
  </g>

  <!-- pulsos de dados a viajar pelas linhas -->
  <g fill="#E6F7FB">
    <circle r="2.6"><animateMotion dur="2.1s" repeatCount="indefinite"><mpath href="#e1"/></animateMotion></circle>
    <circle r="2.6"><animateMotion dur="1.7s" repeatCount="indefinite" begin="0.3s"><mpath href="#e2"/></animateMotion></circle>
    <circle r="2.6"><animateMotion dur="2.4s" repeatCount="indefinite" begin="0.6s"><mpath href="#e3"/></animateMotion></circle>
    <circle r="2.6"><animateMotion dur="1.9s" repeatCount="indefinite" begin="0.9s"><mpath href="#e4"/></animateMotion></circle>
    <circle r="2.6"><animateMotion dur="2.2s" repeatCount="indefinite" begin="0.2s"><mpath href="#e5"/></animateMotion></circle>
    <circle r="2.6"><animateMotion dur="1.8s" repeatCount="indefinite" begin="0.7s"><mpath href="#e6"/></animateMotion></circle>
    <circle r="2.6"><animateMotion dur="2.3s" repeatCount="indefinite" begin="0.4s"><mpath href="#e7"/></animateMotion></circle>
    <circle r="2.6"><animateMotion dur="2.0s" repeatCount="indefinite" begin="1.0s"><mpath href="#e8"/></animateMotion></circle>
    <circle r="2.6"><animateMotion dur="2.5s" repeatCount="indefinite" begin="0.5s"><mpath href="#e9"/></animateMotion></circle>
    <circle r="2.6"><animateMotion dur="1.6s" repeatCount="indefinite" begin="0.1s"><mpath href="#e10"/></animateMotion></circle>
  </g>

  <!-- Nós: pulsam ligeiramente -->
  <g>
    <g transform="translate(60,60)">
      <circle r="8" fill="url(#nodeGlow)"><animate attributeName="r" values="8;10;8" dur="2.4s" repeatCount="indefinite"/></circle>
    </g>
    <g transform="translate(190,40)">
      <circle r="9" fill="url(#nodeGlow)"><animate attributeName="r" values="9;11;9" dur="2.1s" repeatCount="indefinite"/></circle>
    </g>
    <g transform="translate(320,70)">
      <circle r="8" fill="url(#nodeGlow)"><animate attributeName="r" values="8;10;8" dur="2.6s" repeatCount="indefinite"/></circle>
    </g>
    <g transform="translate(100,150)">
      <circle r="7" fill="url(#nodeGlow)"><animate attributeName="r" values="7;9;7" dur="2.2s" repeatCount="indefinite"/></circle>
    </g>
    <g transform="translate(190,130)">
      <circle r="10" fill="url(#nodeGlow)"><animate attributeName="r" values="10;12;10" dur="1.9s" repeatCount="indefinite"/></circle>
    </g>
    <g transform="translate(320,180)">
      <circle r="7" fill="url(#nodeGlow)"><animate attributeName="r" values="7;9;7" dur="2.5s" repeatCount="indefinite"/></circle>
    </g>
    <g transform="translate(230,210)">
      <circle r="8" fill="url(#nodeGlow)"><animate attributeName="r" values="8;10;8" dur="2.3s" repeatCount="indefinite"/></circle>
    </g>
  </g>
</svg>
